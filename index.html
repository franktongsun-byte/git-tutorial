<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo 待办事项</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">
                <span class="title-icon">✦</span>
                我的待办
            </h1>
            <p class="subtitle" id="dateDisplay"></p>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-number" id="totalCount">0</span>
                <span class="stat-label">总计</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-number active" id="activeCount">0</span>
                <span class="stat-label">进行中</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-number completed" id="completedCount">0</span>
                <span class="stat-label">已完成</span>
            </div>
        </div>

        <form class="input-section" id="todoForm">
            <input
                type="text"
                id="todoInput"
                class="todo-input"
                placeholder="添加新的任务..."
                maxlength="100"
                autocomplete="off"
            >
            <button type="submit" class="add-btn" aria-label="添加任务">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </form>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="active">进行中</button>
            <button class="filter-btn" data-filter="completed">已完成</button>
            <button class="clear-btn" id="clearCompleted">清除已完成</button>
        </div>

        <ul class="todo-list" id="todoList"></ul>

        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📝</div>
            <p class="empty-text">还没有任务</p>
            <p class="empty-hint">在上方输入框中添加你的第一个任务吧！</p>
        </div>

        <footer class="footer">
            <p>双击任务可编辑 · 数据自动保存到本地</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
